<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4ef">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">Fade Rosyad<span>.</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/curriculum-vitae/' | relative_url }}">CV</a>
          <a href="{{ '/contact/' | relative_url }}">Contact</a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell main-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>© {{ 'now' | date: '%Y' }} Fade Khalifah Rosyad</span>
        <a href="mailto:faderosyad@gmail.com">Say hello <span aria-hidden="true">↗</span></a>
      </div>
    </footer>
  </body>
</html>
